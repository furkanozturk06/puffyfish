// Şekiller 3 kat büyük çizilir, her pikselin ortası örneklenir (keskin piksel),
// sonra siluetin çevresine koyu kontur eklenir.
function bake(w, h, ax, ay, draw) {
  const S = 3;
  const hi = mk(w * S, h * S), hc = hi.getContext('2d', { willReadFrequently: true });
  hc.scale(S, S); hc.translate(ax, ay);
  draw(hc);
  const src = hc.getImageData(0, 0, w * S, h * S).data;
  const ow = w + 2, oh = h + 2, out = mk(ow, oh), oc = out.getContext('2d');
  const img = oc.createImageData(ow, oh), d = img.data;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = ((y * S + 1) * w * S + x * S + 1) * 4;
    if (src[i + 3] < 128) continue;
    const o = ((y + 1) * ow + x + 1) * 4;
    d[o] = src[i]; d[o + 1] = src[i + 1]; d[o + 2] = src[i + 2]; d[o + 3] = 255;
  }
  const edge = [];
  for (let y = 0; y < oh; y++) for (let x = 0; x < ow; x++) {
    const k = y * ow + x;
    if (d[k * 4 + 3]) continue;
    if ((x > 0 && d[k * 4 - 1]) || (x < ow - 1 && d[k * 4 + 7]) ||
        (y > 0 && d[(k - ow) * 4 + 3]) || (y < oh - 1 && d[(k + ow) * 4 + 3])) edge.push(k);
  }
  for (const k of edge) { d[k * 4] = INK_RGB[0]; d[k * 4 + 1] = INK_RGB[1]; d[k * 4 + 2] = INK_RGB[2]; d[k * 4 + 3] = 255; }
  oc.putImageData(img, 0, 0);
  return { c: out, ox: ax + 1, oy: ay + 1 };
}
function bakeC(hw, hh, draw) { hw = Math.ceil(hw); hh = Math.ceil(hh); return bake(hw * 2, hh * 2, hw, hh, draw); }

function E(c, x, y, rx, ry, col) {
  c.fillStyle = col; c.beginPath(); c.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), 0, 0, TAU); c.fill();
}
function P(c, col, pts) {
  c.fillStyle = col; c.beginPath(); c.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]);
  c.closePath(); c.fill();
}
function Rect(c, x, y, w, h, col) { c.fillStyle = col; c.fillRect(x, y, w, h); }
function line(c, col, lw, pts) {
  c.strokeStyle = col; c.lineWidth = lw; c.lineCap = 'round'; c.beginPath(); c.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]);
  c.stroke();
}

function pixSprite(n, fn) {
  const cv = mk(n, n), x2 = cv.getContext('2d'), c0 = (n - 1) / 2;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const col = fn(Math.hypot(x - c0, y - c0), x, y);
    if (col) { x2.fillStyle = col; x2.fillRect(x, y, 1, 1); }
  }
  return { c: cv, ox: c0, oy: c0 };
}
const BUB = [1, 2, 3].map(rad => {
  const sp = pixSprite(rad * 2 + 3, d => Math.abs(d - rad) <= 0.5 ? 'rgba(225,245,255,0.75)' : null);
  if (rad > 1) { const x2 = sp.c.getContext('2d'), k = Math.round(sp.ox - rad * 0.45); x2.fillStyle = '#ffffff'; x2.fillRect(k, k, 1, 1); }
  return sp;
});
const RINGS = new Map();
function ringSprite(rad, col) {
  const key = rad + col;
  let sp = RINGS.get(key);
  if (!sp) { sp = pixSprite(rad * 2 + 3, d => Math.abs(d - rad) <= 0.5 ? col : null); RINGS.set(key, sp); }
  return sp;
}

function waterImage(z) {
  const a = hexRgb(z.top), b = hexRgb(z.bot), N = 7, cols = [];
  for (let i = 0; i < N; i++) cols.push(a.map((v, j) => Math.round(v + (b[j] - v) * i / (N - 1))));
  const cv = mk(W, H), x2 = cv.getContext('2d'), img = x2.createImageData(W, H), d = img.data;

  fish.push(f);
  Object.assign(tut, { f, phase: 'go', t: 0, lines: L(st.k) });
}
function tutResult(f, ok, tier) {
  if (f !== tut.f) return;
  const st = TUT[tut.i];
  if (ok) {
    const k = st.k === 't3' ? (tier && tier.pts === 5 ? 't3okA' : 't3okB') : st.k + 'ok';
    Object.assign(tut, { phase: 'ok', t: 0, dur: st.okDur || 2.4, lines: L(k) });
    sfx(784, 1046, 0.15, 'square', 0.04, 0.1);
  } else Object.assign(tut, { phase: 'fail', t: 0, dur: 1.8, lines: [L(st.k + 'fail')] });
}
function tutUpdate(dt) {
  const st = TUT[tut.i];
  tut.t += dt;
  let target = 1;
  if (tut.phase === 'go') {
    if (!tut.f.done && tut.f.x - tut.f.front <= PX + r + 40 && !st.need()) target = 0;
  } else if (tut.t > tut.dur) {
    if (tut.phase === 'fail') spawnTut();
    else if (++tut.i < TUT.length) spawnTut();
    else return finishTutorial();
  }
  tut.ts += (target - tut.ts) * Math.min(1, dt * 10);
}

const pageSkins = () => SKINS.map((sk, i) => i).slice(shopPage * SHOP_PAGE, (shopPage + 1) * SHOP_PAGE);

function toLow(e) {

// p: dokunulan nokta (oyun pikseli); klavyeden gelince yok.
function tap(p) {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (ac && ac.state === 'suspended') ac.resume().catch(() => {});   // iOS sesi arka planda kapatır
  if (adBusy) return;
  if (paused) { paused = false; return; }
  if (state === 'menu') {
    if (privacyRequired && inside(p, BTN.privacy)) { click(); native('AdMob', 'showPrivacyOptionsForm'); }
    else if (inside(p, BTN.lang)) { lang = lang === 'tr' ? 'en' : 'tr'; save('sis_lang', lang); document.title = L('doc'); click(); }
    else if (inside(p, BTN.shop)) { state = 'shop'; shopMsg = null; shopPage = Math.floor(skin / SHOP_PAGE); refreshAdDay(); click(); }
    else if (inside(p, BTN.howto)) { click(); startTutorial(); }
    else if (legalLinks().some(l => inside(p, l) && (click(), openUrl(l.url), true))) {}
    else if (inside(p, BTN.play) || !p) { click(); if (tutSeen) start(); else startTutorial(); }
  } else if (state === 'shop') {
    if (inside(p, BTN.back) || !p) { goMenu(); click(); return; }
    if (inside(p, BTN.prev)) { shopPage = (shopPage + SHOP_PAGES - 1) % SHOP_PAGES; click(); return; }
    if (inside(p, BTN.next)) { shopPage = (shopPage + 1) % SHOP_PAGES; click(); return; }
    if (inside(p, BTN.adShop)) { click(); watchForCoins(); return; }
    pageSkins().forEach(i => { if (inside(p, cardRect(i))) shopPick(i); });
  } else if (state === 'dead') {
    if (performance.now() - deadAt < 600) return;
    if (earned > 0 && !doubled && inside(p, BTN.double)) { click(); watchForDouble(); }
    else if (inside(p, BTN.home)) { click(); afterGame(goMenu); } else afterGame(start);
  } else if (state === 'tut') {
    if (inside(p, BTN.skip)) finishTutorial();
    else if (tut.phase !== 'go') { if (tut.t > 0.4) tut.t = tut.dur; }   // yazıyı dokunarak geç
    else puff();
  } else if (state === 'play') puff();
}
function shopPick(i) {
  const sk = SKINS[i];
  if (owned.includes(sk.id)) { skin = i; save('sis_skin_id', sk.id); click(); return; }
  if (coins < sk.price) { shopMsg = { text: L('noCoins'), t: 1.6, good: false }; sfx(200, 120, 0.15, 'triangle', 0.06); return; }
  coins -= sk.price; owned.push(sk.id); skin = i;
  save('sis_coins', coins); save('sis_owned', owned); save('sis_skin_id', sk.id);
  shopMsg = { text: L('bought'), t: 1.6, good: true };
  sfx(660, 660, 0.07, 'square', 0.05); sfx(990, 990, 0.15, 'square', 0.05, 0.08);
  queuePuffer(i);
}

addEventListener('pointerdown', e => { e.preventDefault(); tap(toLow(e)); });

function pop(text, sc, c1, c2, dy) { pops.push({ text, sc, c1, c2, dy: dy || 0, age: 0 }); }
function burst(x, y, n, color, force) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, v = rnd(0.3, 1) * force;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, age: 0, max: rnd(0.4, 0.8), sz: Math.random() < 0.5 ? 1 : 2, color });
  }
}

function update(dt) {
  // Dokunulmazsa kademe kademe söner.
  deflT += dt;
  if (stage > 0 && deflT >= DEFLATE_SECS) { stage--; deflT = 0; sfx(260 + stage * 40, 160, 0.07, 'triangle', 0.02); }
  r += (STAGE_R[stage] - r) * Math.min(1, dt * 16);

  const tutorial = state === 'tut';
  let mdt = dt;                    // balıkların zamanı (eğitimde durabilir)
  if (tutorial) {
    tutUpdate(dt);
    if (state !== 'tut') return;
    speed = TUT_SPEED; mdt = dt * tut.ts;
  } else {
    hunger -= dt / HUNGER_SECS;
    if (hunger <= 0) { hunger = 0; return die(L('starved')); }
    speed = Math.min(SPEED_MAX, SPEED_START + count * SPEED_STEP);
    dist -= speed * dt;
    if (dist <= 0) {
      const f = pending;
      fish.push(f);
      pending = rollFish();
      // Aralık: iki balığın boyu + tepki süresi
      dist = 2 * f.hl + f.s + pending.s + speed * rnd(0.6, 1.1);
    }
  }
  scroll += speed * mdt;

  for (const f of fish) {
    f.x += (f.flee ? speed * 0.9 : -speed) * mdt;
    f.y += f.vy * mdt;
    if (f.done || f.x - f.front > PX + r) continue;

    // Balık bize değdi
    f.done = true;
    if (!tutorial) count++;
    const cx = PX + r, side = Math.random() < 0.5 ? -1 : 1;
    if (f.sp.food) {
      if (stage === 0) {
        f.eaten = true; score += 1;
        hunger = Math.min(1, hunger + FOOD);
        pop(L('yum') + ' +1', 1, '#a6f5b5', '#5fd87a');
        burst(cx, PY, 8, '#e8f8ff', 50);
        sfx(600, 1000, 0.08, 'square', 0.05);
        if (tutorial) tutResult(f, true);
      } else {
        f.flee = true; f.vy = side * 40;
        pop(L('away'), 1, '#d6ecff');
        sfx(300, 200, 0.1, 'triangle', 0.08);
        if (tutorial) tutResult(f, false);
      }
    } else if (stage >= f.cls) {
      f.flee = true; f.vy = side * 40;
      const t = TIERS.find(t => stage - f.cls <= t.diff);
      if (t.pts === 5) {
        combo++; maxCombo = Math.max(maxCombo, combo); comboPulse = 0.35;
        const mult = Math.min(combo, COMBO_MAX), pts = t.pts * mult, k = 1 + 0.12 * (mult - 1);
        score += pts;
        pop(L('close') + (mult > 1 ? ' X' + mult : '') + ' +' + pts, 2, t.c1, t.c2);
        burst(cx, PY, 10 + mult * 4, '#ffe066', 80 + mult * 15);
        sfx(660 * k, 660 * k, 0.07, 'square', 0.05);
        sfx(990 * k, 990 * k, 0.12, 'square', 0.05, 0.07);
        vibrate(25);
      } else {
        if (combo >= 2) { pop(L('comboLost'), 1, '#9aa6b2', null, -14); sfx(400, 200, 0.2, 'triangle', 0.06); }
        combo = 0;
        score += t.pts;
        pop((t.key ? L(t.key) + ' ' : '') + '+' + t.pts, 1, t.c1, t.c2);
        sfx(440, 560, 0.06, 'square', 0.035);
      }
      if (tutorial) tutResult(f, true, t);
    } else if (tutorial) {
      burst(PX, PY, 10, '#f9cf48', 60);
      pop(L('ouch'), 2, '#ff8a6e', '#e5533c');
      sfx(300, 120, 0.2, 'sawtooth', 0.08);
      tutResult(f, false);
    } else {
      eaten = true;
      burst(PX, PY, 22, SKINS[skin].p.body, 110);
      return die(L('eaten'));
    }
  }
  fish = fish.filter(f => !f.eaten && f.x > -f.hl * 1.6 - 60 && f.x < W + 300);
  if (tutorial) return;

  let z = 0;
  ZONES.forEach((zn, i) => { if (count >= zn.at) z = i; });
  if (z !== zone) {
    prevZone = zone; zone = z; zoneFade = 0;
    banner = { text: L('z' + z), age: 0 };
    sfx(523, 523, 0.1, 'square', 0.04); sfx(659, 659, 0.1, 'square', 0.04, 0.1); sfx(784, 784, 0.18, 'square', 0.04, 0.2);
  }
}

// Efektler oyun dursa da akmaya devam eder.
function updateFx(dt) {
  const inGame = state === 'play' || state === 'tut';
  if (!inGame && state !== 'dead') scroll += 20 * dt;
  const zn = ZONES[zone];
  depth += (zn.depth - depth) * Math.min(1, dt * 1.5);
  rays += (zn.rays - rays) * Math.min(1, dt * 1.5);
  zoneFade = Math.min(1, zoneFade + dt / 1.5);
  const drift = inGame ? speed * 0.25 : 8;
  for (const b of bubbles) {
    b.y -= (10 + b.size * 6) * dt; b.x -= drift * dt;
    if (b.y < -6 || b.x < -6) { b.y = SAND_Y + rnd(0, 10); b.x = rnd(0, W + 80); }
  }
  for (const p of plankton) {
    p.x -= drift * 0.6 * dt; p.y += Math.sin(time + p.ph) * 3 * dt;
    if (p.x < -2) { p.x = W + 2; p.y = rnd(10, SAND_Y - 10); }
  }
  for (const p of parts) { p.age += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy -= 25 * dt; }
  parts = parts.filter(p => p.age < p.max);
  for (const p of pops) p.age += dt;
  pops = pops.filter(p => p.age < 0.9);
  if (banner && (banner.age += dt) > 2.2) banner = null;
  if (shopMsg && (shopMsg.t -= dt) <= 0) shopMsg = null;
  comboPulse -= dt;
}

function txt(str, x, y, sc, c1, c2, align) {
  const sp = textSprite(str, sc || 1, c1 || '#ffffff', c2);
  const dx = align === 'left' ? 0 : align === 'right' ? sp.w : sp.w / 2;
  if (!align) x = Math.max(sp.w / 2, Math.min(W - sp.w / 2, x));   // ortalı yazı ekrandan taşmasın
  g.drawImage(sp.c, Math.round(x - dx), Math.round(y - sp.top));
}
function rrect(x, y, w, h, col) { g.fillStyle = col; g.fillRect(x + 1, y, w - 2, h); g.fillRect(x, y + 1, w, h - 2); }
function panel(x, y, w, h) {
  rrect(x - 1, y - 1, w + 2, h + 2, INK);
  rrect(x, y, w, h, '#d08a3e');
  g.fillStyle = '#e9a85e'; g.fillRect(x + 1, y, w - 2, 1);
  rrect(x + 2, y + 2, w - 4, h - 4, '#f6e7bf');

}
function button(b, label, sc) {

}

function drawArrow(x, y, up) {

// tap: parmak tekrar tekrar dokunuyor; wait: el kalkık bekliyor.
function drawHand(x, y, mode) {
  if (mode === 'tap') {
    const k = (time * 2.5) % 1, down = k < 0.5;
    if (down) {
      const sp = ringSprite(Math.round(3 + k * 14), 'rgba(255,255,255,0.85)');
      g.globalAlpha = 1 - k * 2; g.drawImage(sp.c, x - sp.ox, y - sp.oy); g.globalAlpha = 1;
    }
    g.drawImage(HAND.c, x - HAND.ox, y - (down ? 0 : 5) - HAND.oy);
  } else g.drawImage(HAND.c, x - HAND.ox, y - 9 - Math.round(Math.sin(time * 3) * 2) - HAND.oy);
}

// Balığı gövde merkezi (x, y) olacak şekilde k kat büyütüp çizer.
function drawFishAt(id, k, x, y, flee, ph) {
  const im = FishArt.sprite(id, Math.floor(time * 6 + (ph || 0)) & 1), b = im.box;
  const ax = Math.round((b.x0 + b.x1 + 1) / 2 * k), ay = Math.round((b.y0 + b.y1 + 1) / 2 * k);
  x = Math.round(x); y = Math.round(y);
  if (flee) { g.save(); g.translate(x, y); g.scale(-1, 1); g.drawImage(im, -ax, -ay, im.width * k, im.height * k); g.restore(); }
  else g.drawImage(im, x - ax, y - ay, im.width * k, im.height * k);
}
function drawFish(f) { drawFishAt(f.sp.id, f.k, f.x, f.y + Math.sin(time * 2 + f.ph) * 1.5, f.flee, f.ph); }
// Yaklaşan her balığın başının üstünde, şu anki kademene göre anında değişen rozet.
function drawBadges() {
  for (const f of fish) {
    if (f.done || f.flee || f.x - f.front > W - 4) continue;
    let sp, danger = false;
    if (f.sp.food) sp = stage === 0 ? BADGE.eat : BADGE.no;
    else {
      danger = stage < f.cls;
      sp = BADGE[danger ? 'bad' : stage === f.cls ? 'gold' : 'ok'][f.cls];
    }
    const close = f.x - f.front - (PX + r) < 90;
    const bounce = danger && close ? -Math.round(Math.abs(Math.sin(time * 10)) * 2) : 0;
    const k = f.sp.food ? 1 : 2, w = sp.c.width * k, h = sp.c.height * k;   // nokta rozetleri 2 kat büyük
    const y = Math.max(64, Math.round(f.y + Math.sin(time * 2 + f.ph) * 1.5 - f.s - 6 - h)) + bounce;
    // Başa yakın dursun ama ekranın sağından taşmasın: uzun burunlu balıkta da burun girer girmez görünür.
    const bx = Math.min(W - w - 3, Math.round(f.x - f.hl * 0.7 - w / 2));
    g.drawImage(sp.c, bx, y, w, h);
  }
  if (!eaten) {
    const m = BADGE.me[stage], w = m.c.width * 2, h = m.c.height * 2, by = Math.max(64, Math.round(PY - r - 8 - h));
    g.drawImage(m.c, Math.round(PX - w / 2), by, w, h);
  }
}
// Balon balığı 2 kat büyütülmüş çizilir; çizim yarıçapı oyun yarıçapının yarısı.
const PUFF = new Map();
function puffImg(R, frame, si, dead) {
  const key = R + '_' + frame + '_' + (dead ? 'd' : si);
  if (!PUFF.has(key)) PUFF.set(key, FishArt.puffer(R, frame, dead ? DEAD_SKIN : SKINS[si].p));
  return PUFF.get(key);
}
function drawPufferAt(x, y, rad, si, dead, k) {
  k = k || 2;
  const R = Math.max(4, Math.round(rad / 2)), im = puffImg(R, Math.floor(time * 5) & 1, si, dead);
  const Ls = R > 4 ? (R >= 9 ? 2 : 1) : 0, pad = Ls + 3;
  const [cx, cy] = im.center || [R + pad + 3, R + pad + 1];   // çizim kendi merkezini söylüyorsa onu kullan
  g.drawImage(im, Math.round(x - cx * k), Math.round(y - cy * k), im.width * k, im.height * k);
}
function drawPuffer(x, y, rad, dead) { drawPufferAt(x, y + Math.sin(time * 2.5) * 1.5, rad, skin, dead); }

function groundTop(wx) { return SAND_Y + Math.round(Math.sin(wx * 0.05) * 1.5 + Math.sin(wx * 0.13) * 0.8); }
function hills(f, col, fn) {
  g.fillStyle = col;
  const off = scroll * f;
  for (let x = 0; x < W; x++) { const h = Math.round(fn(Math.floor(x + off))); g.fillRect(x, SAND_Y - h, 1, h + 2); }
}
function weed(x, gy, h, ph) {
  for (const [dx, k] of [[0, 1], [3, 0.7], [-3, 0.5]]) {
    const hh = Math.round(h * k), xs = [];
    for (let y = 0; y < hh; y++) xs.push(x + dx + Math.round(Math.sin(time * 1.8 + ph + dx + y * 0.12) * 3 * y / hh));
    g.fillStyle = INK;
    for (let y = 0; y < hh; y++) g.fillRect(xs[y] - 1, gy - y, (y > hh - 3 ? 1 : 2) + 2, 1);
    g.fillRect(xs[hh - 1], gy - hh, 1, 1);
    g.fillStyle = '#2f9c58';
    for (let y = 0; y < hh; y++) g.fillRect(xs[y], gy - y, y > hh - 3 ? 1 : 2, 1);
    g.fillStyle = '#5cc47f';
    for (let y = 2; y < hh - 2; y += 4) g.fillRect(xs[y], gy - y, 1, 2);
  }
}

const tops = new Int16Array(W);
function drawWorld() {
  if (zoneFade < 1 && prevZone !== zone) { g.drawImage(WATER[prevZone], 0, 0); g.globalAlpha = zoneFade; }
  g.drawImage(WATER[zone], 0, 0);
  g.globalAlpha = 1;

  if (rays > 0.02) for (let i = 0; i < 3; i++) {
    const x0 = W * (0.25 + i * 0.35) + 40 + Math.sin(time * 0.25 + i * 2) * 10;
    for (let s = 0; s < 6; s++) {
      g.fillStyle = 'rgba(255,255,255,' + (0.075 * rays * (1 - s / 6)).toFixed(3) + ')';
      for (let y = s * 28; y < (s + 1) * 28 && y < SAND_Y; y++) g.fillRect(Math.round(x0 - y * 0.45), y, Math.round(10 + y * 0.12), 1);
    }
  }

  hills(0.15, 'rgba(3,26,48,0.22)', k => 34 + 12 * Math.sin(k * 0.017) + 6 * Math.sin(k * 0.051));
  hills(0.4, 'rgba(3,26,48,0.3)', k => 16 + 9 * Math.sin(k * 0.031 + 1) + 5 * Math.sin(k * 0.097));

  for (let x = 0; x < W; x++) tops[x] = groundTop(Math.floor(x + scroll));
  g.fillStyle = INK;       for (let x = 0; x < W; x++) g.fillRect(x, tops[x] - 1, 1, 1);
  g.fillStyle = '#e3c486'; for (let x = 0; x < W; x++) g.fillRect(x, tops[x], 1, H - tops[x]);
  g.fillStyle = '#f5e0a8'; for (let x = 0; x < W; x++) g.fillRect(x, tops[x], 1, 1);
  g.fillStyle = '#cfae70'; g.fillRect(0, H - 4, W, 4);
  g.fillStyle = '#b8925a';
  for (let x = 0; x < W; x++) {
    const h = hash(Math.floor(x + scroll));
    if (h < 0.22) g.fillRect(x, tops[x] + 2 + Math.floor(h * 60) % 8, 1, 1);
  }

  for (const d of DECO) {
    const sx = Math.round(((d.x - scroll) % SW + SW) % SW - 30);
    if (sx > W + 30) continue;
    const gy = groundTop(Math.floor(sx + scroll)) + 1;
    if (d.type === 'weed') weed(sx, gy, d.h, d.ph);
    else { const sp = DECO_ART[d.type]; g.drawImage(sp.c, sx - sp.ox, gy - sp.oy); }
  }

  if (depth > 0.01) { g.fillStyle = 'rgba(4,16,34,' + depth.toFixed(3) + ')'; g.fillRect(0, 0, W, H); }

  for (const b of bubbles) { const sp = BUB[b.size - 1]; g.drawImage(sp.c, Math.round(b.x) - sp.ox, Math.round(b.y) - sp.oy); }
  g.fillStyle = 'rgba(255,255,255,0.35)';
  for (const p of plankton) g.fillRect(Math.round(p.x), Math.round(p.y), 1, 1);
}

function drawHud() {
  const tutorial = state === 'tut';
  if (state !== 'dead' && !tutorial) {
    txt(String(score), W / 2, 26, 3, '#ffffff', '#dcecff');
    if (combo >= 2) txt(L('combo') + ' X' + Math.min(combo, COMBO_MAX), W / 2, 54, comboPulse > 0 ? 2 : 1, '#ffe066', '#f5a623');
  }

  drawPufferAt(11, 11, 8, skin, false, 1);   // açlık çubuğunun yanında bizim balık (küçük)
  const bx = 24, by = 8, bw = 54, lowH = hunger < 0.3;
  rrect(bx - 1, by - 1, bw + 2, 8, INK);
  g.fillStyle = '#1b3850'; g.fillRect(bx, by, bw, 6);
  const fw = Math.round(bw * hunger);
  if (fw > 0 && !(lowH && Math.floor(time * 6) % 2)) {
    g.fillStyle = lowH ? '#ff5d4a' : '#5fd87a'; g.fillRect(bx, by, fw, 6);
    g.fillStyle = lowH ? '#ff9d8a' : '#a6f5b5'; g.fillRect(bx, by, fw, 2);
  }

  if (!tutorial && best) txt(L('best') + ' ' + best, W - 6, 8, 1, '#bfe0ff', null, 'right');
  if (banner) {
    g.globalAlpha = Math.max(0, Math.min(1, banner.age * 3, (2.2 - banner.age) * 2));
    txt(banner.text, W / 2, 84, 2, '#ffffff', '#bfe0ff');
    g.globalAlpha = 1;
  }
}

function drawMenu() {
  button(BTN.lang, L('lang'));
  if (privacyRequired) drawPaper(BTN.privacy.x + 4, BTN.privacy.y + 2);
  drawCoins(W - 6, 8, coins);
  if (best) txt(L('best') + ' ' + best, W - 6, 20, 1, '#ffffff', null, 'right');
  const [t1, t2] = L('title').split(' ');
  txt(t1, W / 2, 40, 5, '#ffe066', '#f5a623');
  txt(t2, W / 2, 84, 5, '#ffe066', '#f5a623');
  wrap([L('tagline')], W - 16).forEach((l, i) => txt(l.s, W / 2, 132 + i * 11, 1, '#ffffff'));
  menuR += (STAGE_R[Math.floor(time * 1.2) % 4] - menuR) * 0.2;
  drawPuffer(50, 180, menuR, false);
  drawFishAt('kopekbaligi', 2, 132, 182, false, 0);
  button(BTN.play, L('play'), 2);
  button(BTN.shop, L('shop'));
  button(BTN.howto, L('howto'));
  for (const l of legalLinks()) {
    txt(l.t, l.x + 2, l.y + 3, 1, '#d6ecff', null, 'left');
    g.fillStyle = '#d6ecff'; g.fillRect(l.x + 2, l.y + 11, l.w - 4, 1);   // altı çizili: bağlantı
  }
}

// Uzun yazıları dar ekrana sığacak şekilde satırlara böler; k = kaçıncı kaynak satırdan geldiği.
const WRAP = new Map();
function wrap(lines, maxW) {
  const key = lines.join('|') + maxW;
  if (WRAP.has(key)) return WRAP.get(key);
  const out = [];
  lines.forEach((ln, k) => {
    let cur = '';
    for (const w of ln.split(' ')) {
      const t = cur ? cur + ' ' + w : w;
      if (cur && textSprite(t, 1, '#ffffff').w > maxW) { out.push({ s: cur, k }); cur = w; } else cur = t;
    }
    out.push({ s: cur, k });
  });
  WRAP.set(key, out);
  return out;
}

function drawShop() {
  g.fillStyle = 'rgba(4,16,34,0.35)'; g.fillRect(0, 0, W, H);
  txt(L('shop'), W / 2, 26, 2, '#ffe066', '#f5a623');
  button(BTN.back, L('back'));
  drawCoins(W - 6, 9, coins);
  pageSkins().forEach(i => {
    const sk = SKINS[i], b = cardRect(i), cx = b.x + b.w / 2, sel = i === skin, have = owned.includes(sk.id);
    if (sel) rrect(b.x - 3, b.y - 3, b.w + 6, b.h + 6, '#ffe066');
    panel(b.x, b.y, b.w, b.h);
    drawPufferAt(cx + 2, b.y + 22, STAGE_R[1], i, false);
    txt(sk[lang], cx, b.y + 42, 1, '#ffffff');
    if (sel) txt(L('selected'), cx, b.y + 53, 1, '#7ee08f');
    else if (have) txt(L('select'), cx, b.y + 53, 1, '#9fd4ff');
    else {
      const s = String(sk.price), w = textSprite(s, 1, '#ffe066').w;
      txt(s, cx + 5, b.y + 53, 1, coins >= sk.price ? '#ffe066' : '#ff8a6e');
      g.drawImage(COIN.c, Math.round(cx + 5 - w / 2 - 11), b.y + 52);
    }
  });
  if (SHOP_PAGES > 1) { button(BTN.prev, '<'); button(BTN.next, '>'); }
  refreshAdDay();
  // "REKLAM İZLE +5" ve yanında altın simgesi
  const ab = BTN.adShop, al = L('watchAd'), aw = textSprite(al, 1, '#e07b39').w, ax = Math.round(ab.x + (ab.w - aw - 1 - COIN.c.width) / 2);
  panel(ab.x, ab.y, ab.w, ab.h);
  txt(al, ax, ab.y + Math.round((ab.h - 7) / 2), 1, '#e07b39', null, 'left');
  g.drawImage(COIN.c, ax + aw + 1, ab.y + Math.round((ab.h - 7) / 2) - 1);
  txt(L('adLeft') + ' ' + adLeft + '/' + AD_DAILY, W / 2, 290, 1, adLeft > 0 ? '#bfe0ff' : '#ff8a6e');
  if (shopMsg) {
    const y = 302, col = shopMsg.good ? '#7ee08f' : '#ff8a6e';
    if (shopMsg.coin) {
      const w = textSprite(shopMsg.text, 1, '#ffe066').w;
      txt(shopMsg.text, W / 2 + 6, y, 1, '#ffe066');
      g.drawImage(COIN.c, Math.round(W / 2 + 6 - w / 2 - 11), y - 1);
    } else txt(shopMsg.text, W / 2, y, 1, col);
  }
}

function drawTut() {
  const st = TUT[tut.i];
  txt(L('howtoTitle'), W / 2, 26, 1, '#ffffff');
  for (let k = 1; k < TUT.length; k++) {
    const x = W / 2 - 14 + (k - 1) * 10;
    rrect(x - 1, 37, 6, 6, INK);
    g.fillStyle = k <= tut.i ? '#ffe066' : '#3b5670'; g.fillRect(x, 38, 4, 4);
  }
  button(BTN.skip, L('skip'));
  const bob = Math.round(Math.sin(time * 6) * 2);
  if (tut.phase === 'intro') drawArrow(PX, PY - r - 8 + bob, false);
  if (tut.phase === 'go' && !st.need()) drawHand(W - 22, 100, st.hand);
  if (tut.phase === 'ok' && st.arrow) drawArrow(51, 17 - bob, true);
  if (tut.lines) {
    const fail = tut.phase === 'fail', rows = wrap(tut.lines, W - 20), h = 10 + rows.length * 11, py = PY + 59;
    panel(6, py, W - 12, h);
    rows.forEach((l, i) => txt(l.s, W / 2, py + 6 + i * 11, 1,
      l.k === 0 ? (fail ? '#ff8a6e' : '#ffe066') : '#ffffff', l.k === 0 ? (fail ? '#e5533c' : '#f5a623') : null));
    if (tut.phase !== 'go' && tut.t > 0.4 && time % 0.8 < 0.5) {      // "dokun, devam" işareti
      const ix = W - 20, iy = py + h - 7;
      g.fillStyle = '#e07b39'; g.fillRect(ix, iy, 5, 1); g.fillRect(ix + 1, iy + 1, 3, 1); g.fillRect(ix + 2, iy + 2, 1, 1);
    }
  }
}

function drawDead() {
  const e = performance.now() - deadAt;
  g.fillStyle = 'rgba(4,14,28,' + (0.55 * Math.min(1, e / 400)).toFixed(3) + ')';
  g.fillRect(0, 0, W, H);
  if (e < 300) return;
  txt(deadMsg, W / 2, 62, 3, '#ff8a6e', '#e5533c');
  const px = 10, pr = W - 22;
  panel(px, 98, W - 20, 104);
  txt(L('score'), px + 12, 110, 1, '#e07b39', null, 'left');
  txt(String(score), pr, 108, 2, '#ffffff', '#dcecff', 'right');
  txt(L('best'), px + 12, 134, 1, '#e07b39', null, 'left');
  if (newBest) txt(L('new'), px + 12, 146, 1, '#ff5d4a', null, 'left');
  txt(String(best), pr, 132, 2, '#ffffff', '#dcecff', 'right');
  wrap([L('z' + zone) + (maxCombo >= 2 ? '  ·  ' + L('combo') + ' X' + maxCombo : '')], W - 36)
    .forEach((l, i) => txt(l.s, W / 2, 162 + i * 10, 1, '#5aa0cf'));
  const s = '+' + earned, w = textSprite(s, 1, '#ffe066').w;
  txt(s, W / 2 + 6, 186, 1, '#ffe066');
  g.drawImage(COIN.c, Math.round(W / 2 + 6 - w / 2 - 11), 185);
  if (e > 600) {
    button(BTN.retry, L('retry')); button(BTN.home, L('home'));
    if (earned > 0 && !doubled) button(BTN.double, L('double'));
    if (deadNote) txt(deadNote.text, W / 2, 268, 1, deadNote.good ? '#7ee08f' : '#ff8a6e');
  }
}

function render() {
  g.save();
  if (state === 'dead') {
    const k = 1 - (performance.now() - deadAt) / 350;
    if (k > 0) g.translate(Math.round(rnd(-3, 3) * k), Math.round(rnd(-3, 3) * k));
  }
  drawWorld();
  if (state === 'menu') { g.restore(); drawMenu(); return; }
  if (state === 'shop') { g.restore(); drawShop(); return; }

  for (const f of fish) drawFish(f);
  if (!eaten) drawPuffer(PX, PY, r, state === 'dead');
  for (const p of parts) {
    g.globalAlpha = 1 - p.age / p.max; g.fillStyle = p.color;
    g.fillRect(Math.round(p.x), Math.round(p.y), p.sz, p.sz);
  }
  g.globalAlpha = 1;
  if (state !== 'dead') drawBadges();
  for (const p of pops) {
    g.globalAlpha = Math.max(0, Math.min(1, (0.9 - p.age) * 4));
    const sc = p.sc > 1 && textSprite(p.text, 2, p.c1, p.c2).w > W - 4 ? 1 : p.sc;
    txt(p.text, PX, Math.max(70, PY - r - 16) - p.age * 22 + p.dy, sc, p.c1, p.c2);
  }
  g.globalAlpha = 1;
  g.restore();

  drawHud();
  if (state === 'tut') drawTut();
  if (state === 'dead') drawDead();
}

// Sprite'lar: seçili görünüm ve ilk bölge hemen, gerisi her karede birkaç tane.
const bakeQueue = [];
function queuePuffer(si) {
  for (let R = 4; R <= 21; R++) for (const f of [0, 1]) bakeQueue.unshift(() => puffImg(R, f, si, false));
}
queuePuffer(skin);
for (const sp of SPECIES) for (const f of [0, 1]) bakeQueue.push(() => FishArt.sprite(sp.id, f));

let lastT = performance.now();
let pageBg = '';
function loop(now) {
  const dt = Math.min(0.033, (now - lastT) / 1000);
  lastT = now; time = now / 1000;
  for (let n = state === 'play' ? 1 : 3; n > 0 && bakeQueue.length; n--) bakeQueue.shift()();
  if (!paused && (state === 'play' || state === 'tut')) update(dt);
  if (!paused) updateFx(dt);
  updateFakeAd(dt);
  render();
  drawFakeAd();
  if (paused) {
    g.fillStyle = 'rgba(4,14,28,0.6)'; g.fillRect(0, 0, W, H);
    txt(L('paused'), W / 2, H / 2 - 20, 2, '#ffffff', '#bfe0ff');
    if (time % 1 < 0.7) txt(L('resume'), W / 2, H / 2 + 10, 1, '#ffe066', '#f5a623');
  }
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(low, 0, 0, canvas.width, canvas.height);
  // Çentik şeridi suyun üst rengiyle aynı olsun
  if (ZONES[zone].top !== pageBg) { pageBg = ZONES[zone].top; document.body.style.background = pageBg; }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>

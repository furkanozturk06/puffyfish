function load(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

const TAU = Math.PI * 2;
const INK = '#141c2b', INK_RGB = [20, 28, 43];
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
function hash(n) {
  n = Math.imul(n ^ 0x9e3779b9, 0x85ebca6b);
  n = Math.imul(n ^ (n >>> 13), 0xc2b2ae35);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}

// ---------- Sprite üretimi ----------
// Şekiller 3 kat büyük çizilir, her pikselin ortası örneklenir (keskin piksel),
// sonra siluetin çevresine koyu kontur eklenir.
function bake(w, h, ax, ay, draw) {
  const S = 3;
  const hi = mk(w * S, h * S), hc = hi.getContext('2d', { willReadFrequently: true });
  hc.scale(S, S); hc.translate(ax, ay);
  draw(hc);
  const src = hc.getImageData(0, 0, w * S, h * S).data;
  const ow = w + 2, oh = h + 2, out = mk(ow, oh), oc = out.getContext('2d');
  const img = oc.createImageData(ow, oh), d = img.data;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = ((y * S + 1) * w * S + x * S + 1) * 4;
    if (src[i + 3] < 128) continue;
    const o = ((y + 1) * ow + x + 1) * 4;
    d[o] = src[i]; d[o + 1] = src[i + 1]; d[o + 2] = src[i + 2]; d[o + 3] = 255;
  }
  const edge = [];
  for (let y = 0; y < oh; y++) for (let x = 0; x < ow; x++) {
    const k = y * ow + x;
    if (d[k * 4 + 3]) continue;
    if ((x > 0 && d[k * 4 - 1]) || (x < ow - 1 && d[k * 4 + 7]) ||
        (y > 0 && d[(k - ow) * 4 + 3]) || (y < oh - 1 && d[(k + ow) * 4 + 3])) edge.push(k);
  }
  for (const k of edge) { d[k * 4] = INK_RGB[0]; d[k * 4 + 1] = INK_RGB[1]; d[k * 4 + 2] = INK_RGB[2]; d[k * 4 + 3] = 255; }
  oc.putImageData(img, 0, 0);
  return { c: out, ox: ax + 1, oy: ay + 1 };
}
function bakeC(hw, hh, draw) { hw = Math.ceil(hw); hh = Math.ceil(hh); return bake(hw * 2, hh * 2, hw, hh, draw); }

function E(c, x, y, rx, ry, col) {
  c.fillStyle = col; c.beginPath(); c.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), 0, 0, TAU); c.fill();
}
function P(c, col, pts) {
  c.fillStyle = col; c.beginPath(); c.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]);
  c.closePath(); c.fill();
}
function Rect(c, x, y, w, h, col) { c.fillStyle = col; c.fillRect(x, y, w, h); }
function line(c, col, lw, pts) {
  c.strokeStyle = col; c.lineWidth = lw; c.lineCap = 'round'; c.beginPath(); c.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]);
  c.stroke();
}
function clipE(c, rx, ry, fn) { c.save(); c.beginPath(); c.ellipse(0, 0, rx, ry, 0, 0, TAU); c.clip(); fn(); c.restore(); }
// Gövdenin alt (dy<0) ya da üst (dy>0) kenarında hilal: gölge ve parlama.
function rim(c, rx, ry, dy, col) {
  c.fillStyle = col; c.beginPath();
  c.ellipse(0, 0, rx, ry, 0, 0, TAU);
  c.moveTo(rx, dy); c.ellipse(0, dy, rx, ry, 0, 0, TAU);
  c.fill('evenodd');
}
function teeth(c, x0, x1, y, h, n) {
  const w = (x1 - x0) / n;
  for (let i = 0; i < n; i++) P(c, '#ffffff', [x0 + i * w, y, x0 + (i + 1) * w, y, x0 + (i + 0.5) * w, y + h]);
}
function eyeF(c, x, y, er, angry) {
  er = Math.max(1.5, er); x = Math.round(x) + 0.5; y = Math.round(y) + 0.5;
  E(c, x, y, er + 1, er + 1, INK);
  E(c, x, y, er, er, '#ffffff');
  const pr = Math.max(0.9, er * 0.55);
  E(c, x - er * 0.35, y + 0.2, pr, pr, INK);
  if (angry) line(c, INK, Math.max(1, er * 0.55), [x + er * 1.4, y - er * 1.7, x - er * 1.1, y - er * 0.7]);
}
function tailF(c, hl, s, col, f, k) {
  c.save(); c.translate(hl * 0.8, 0); c.rotate(f ? 0.2 : -0.2);
  const q = s * (k || 1);
  P(c, col, [0, -q * 0.3, q * 0.95, -q * 0.95, q * 0.55, 0, q * 0.95, q * 0.95, 0, q * 0.3]);
  c.restore();
}
// Sırt koyu, yan orta, karın açık; altta gölge, üstte parlama.
function body(c, hl, s, k, extra) {
  E(c, 0, 0, hl, s, k.side);
  clipE(c, hl, s, () => {
    E(c, 0, -s * 1.05, hl * 1.15, s * 0.85, k.back);
    E(c, 0, s * 1.05, hl * 1.1, s * 0.6, k.belly);
    if (extra) extra();
    rim(c, hl, s, -Math.max(1.4, s * 0.16), k.shade);
    rim(c, hl, s, Math.max(1, s * 0.1), k.lite);
  });
}

// Balıklar yerel koordinatta sola bakar: baş -hl, kuyruk +hl.
const DRAW = {
  hamsi(c, hl, s, f) {
    tailF(c, hl, s, '#4f86ad', f);
    P(c, '#4f86ad', [hl * 0.05, -s * 0.8, hl * 0.3, -s * 1.35, hl * 0.45, -s * 0.7]);
    body(c, hl, s, { back: '#5d93ba', side: '#c4dbe8', belly: '#eef7fb', shade: '#8fb0c4', lite: '#8fc0e0' },
      () => Rect(c, -hl, -0.5, hl * 2, 1, '#eaf6ff'));
    eyeF(c, -hl * 0.6, -s * 0.1, s * 0.32, false);
  },
  karides(c, hl, s, f) {
    const dark = '#d65c48';
    c.save(); c.translate(hl * 0.85, s * 0.1); c.rotate(f ? 0.15 : -0.15);
    P(c, '#e8735e', [0, 0, s * 1.1, -s * 0.9, s * 1.3, 0, s * 1.1, s * 0.9]);
    c.restore();
    for (let i = 0; i < 4; i++) { const x = -hl * 0.3 + i * hl * 0.25; line(c, dark, 1, [x, s * 0.6, x + (f ? 1 : -1), s * 1.4]); }
    line(c, dark, 1, [-hl * 0.8, -s * 0.4, -hl * 1.15, -s * 1.5, -hl * 1.3, -s * 1.8]);
    line(c, dark, 1, [-hl * 0.8, -s * 0.2, -hl * 1.3, -s * 0.9]);
    body(c, hl, s, { back: '#f08872', side: '#ffa48f', belly: '#ffd0c2', shade: dark, lite: '#ffc4b4' }, () => {
      for (let i = 1; i < 5; i++) Rect(c, Math.round(-hl * 0.5 + i * hl * 0.28), -s, 1, s * 1.2, '#e06a55');
    });
    P(c, '#f08872', [-hl * 0.85, -s * 0.5, -hl * 1.3, -s * 0.6, -hl * 0.9, -s * 0.1]);
    eyeF(c, -hl * 0.62, -s * 0.55, s * 0.3, false);
  },
  palyaco(c, hl, s, f) {
    tailF(c, hl, s, '#f06a14', f);
    P(c, '#f06a14', [-hl * 0.3, -s * 0.8, hl * 0.05, -s * 1.45, hl * 0.5, -s * 0.7]);
    P(c, '#f06a14', [-hl * 0.1, s * 0.8, hl * 0.15, s * 1.35, hl * 0.35, s * 0.7]);
    body(c, hl, s, { back: '#ff7d1f', side: '#ff8e2e', belly: '#ffb062', shade: '#d95a12', lite: '#ffc078' }, () => {
      for (const [bx, bw] of [[-hl * 0.38, hl * 0.3], [hl * 0.28, hl * 0.28]]) {
        Rect(c, bx - bw / 2 - 1, -s, bw + 2, s * 2, INK);
        Rect(c, bx - bw / 2, -s, bw, s * 2, '#ffffff');
      }
    });
    eyeF(c, -hl * 0.68, -s * 0.15, s * 0.28, false);
  },
  kelebek(c, hl, s, f) {
    const fin = '#f2b51a';
    tailF(c, hl, s, fin, f, 0.8);
    P(c, fin, [-hl * 0.4, -s * 0.85, -hl * 0.1, -s * 1.35, hl * 0.6, -s * 1.05, hl * 0.85, -s * 0.4]);
    P(c, fin, [-hl * 0.1, s * 0.85, hl * 0.6, s * 1.15, hl * 0.85, s * 0.4]);
    body(c, hl, s, { back: '#ffd23f', side: '#ffe066', belly: '#fff2b0', shade: '#e0a614', lite: '#fff3a8' }, () => {
      Rect(c, Math.round(-hl * 0.62), -s, Math.max(2, Math.round(hl * 0.22)), s * 2, INK);
      E(c, hl * 0.5, -s * 0.35, Math.max(1.2, s * 0.18), Math.max(1.2, s * 0.18), INK);
    });
    P(c, '#ffe066', [-hl * 0.9, -s * 0.15, -hl * 1.3, s * 0.05, -hl * 0.9, s * 0.25]);
    eyeF(c, -hl * 0.52, -s * 0.15, s * 0.24, false);
  },
  levrek(c, hl, s, f) {
    const fin = '#2d5a47';
    tailF(c, hl, s, fin, f);
    const pts = [-hl * 0.5, -s * 0.75];
    for (let i = 0; i <= 5; i++) pts.push(-hl * 0.45 + i * hl * 0.2, -s * (i % 2 ? 1.0 : 1.4));
    pts.push(hl * 0.6, -s * 0.6);
    P(c, fin, pts);
    P(c, fin, [-hl * 0.1, s * 0.75, hl * 0.2, s * 1.35, hl * 0.4, s * 0.7]);
    body(c, hl, s, { back: '#3f7059', side: '#7aab8c', belly: '#d8eedb', shade: '#2f5646', lite: '#9cc9ab' }, () => {
      c.fillStyle = '#5f9174';
      for (let j = -2; j <= 2; j++) for (let i = 0; i < 6; i++)
        c.fillRect(Math.round(-hl * 0.15 + i * hl * 0.17 + (j & 1) * hl * 0.08), Math.round(j * s * 0.2), 1, 1);
      E(c, -hl * 0.78, s * 0.32, hl * 0.24, s * 0.22, '#3a1620');
      teeth(c, -hl * 0.98, -hl * 0.6, s * 0.12, s * 0.18, 4);
      c.strokeStyle = '#2f5646'; c.lineWidth = 1; c.beginPath(); c.arc(-hl * 0.62, 0, s * 0.55, -0.9, 0.9); c.stroke();
    });
    P(c, fin, [-hl * 0.25, s * 0.15, hl * 0.1, s * 0.5, -hl * 0.1, s * 0.55]);
    eyeF(c, -hl * 0.58, -s * 0.3, s * 0.15, true);
  },
  barakuda(c, hl, s, f) {

const SPOTS = [[-0.45, -0.5, 0.11], [-0.1, -0.7, 0.09], [-0.68, -0.15, 0.08], [0.2, -0.78, 0.07], [-0.28, -0.22, 0.07], [0.05, -0.42, 0.06]];
// Balon balığı sağa bakar; şişince dikenleri çıkar, sönükken ağzı açıktır.
function pufferSprite(R, frame, si, dead) {
  const key = 'p' + R + '_' + frame + (dead ? 'd' : si);
  let sp = SPR.get(key);
  if (sp) return sp;
  const p = dead ? DEAD_SKIN : SKINS[si].p, puffed = R > R_MIN;
  const L = puffed ? 1 + Math.round(4 * (R - R_MIN) / (R_MAX - R_MIN)) : 0;
  const T = Math.round(3 + R * 0.35);
  sp = bakeC(R + L + T + 4, R + L + 6, c => {
    c.save(); c.translate(-R * 0.82, 0); c.rotate(frame ? 0.25 : -0.25);
    P(c, p.fin, [0, -2, -T - 1, -T * 0.85, -T * 0.6, 0, -T - 1, T * 0.85, 0, 2]);
    c.restore();
    P(c, p.fin, [-R * 0.62, -R * 0.72, -R * 0.9, -R - 3, -R * 0.2, -R * 0.95]);
    if (puffed) {
      const n = Math.max(10, Math.min(24, Math.round(TAU * R / 5))), w = Math.min(0.22, 2.4 / R);
      for (let i = 0; i < n; i++) {
        const a = (i + 0.5) * TAU / n;
        P(c, p.spike, [Math.cos(a - w) * R * 0.92, Math.sin(a - w) * R * 0.92, Math.cos(a + w) * R * 0.92, Math.sin(a + w) * R * 0.92,
                       Math.cos(a) * (R + L + 0.5), Math.sin(a) * (R + L + 0.5)]);
      }
    }
    E(c, 0, 0, R, R, p.body);
    clipE(c, R, R, () => {
      E(c, R * 0.08, R * 0.95, R * 1.1, R * 0.65, p.belly);
      if (R >= 8) for (const [sx, sy, sr] of SPOTS) {
        const sr2 = Math.max(0.7, R * sr);
        E(c, Math.round(R * sx) + 0.5, Math.round(R * sy) + 0.5, sr2, sr2, p.spot);
      }
      rim(c, R, R, -Math.max(1.3, R * 0.14), p.shade);
      rim(c, R, R, Math.max(1, R * 0.08), p.lite);
    });
    c.save(); c.translate(-R * 0.08, R * 0.3); c.rotate(frame ? 0.7 : 0.2);
    E(c, -R * 0.2, 0, Math.max(2, R * 0.28), Math.max(1.2, R * 0.14), p.fin);
    c.restore();
    if (puffed && !dead) E(c, R * 0.55, R * 0.12, R * 0.12, R * 0.08, '#ff9b7d');
    const er = Math.max(2, Math.round(R * 0.24)), ex = Math.round(R * 0.42) + 0.5, ey = Math.round(-R * 0.18) + 0.5;
    E(c, ex, ey, er + 1, er + 1, INK);
    E(c, ex, ey, er, er, '#ffffff');
    if (dead) {
      line(c, INK, 1, [ex - er * 0.6, ey - er * 0.6, ex + er * 0.6, ey + er * 0.6]);
      line(c, INK, 1, [ex - er * 0.6, ey + er * 0.6, ex + er * 0.6, ey - er * 0.6]);
    } else {
      const pr = Math.max(1, er * 0.55);
      E(c, ex + er * 0.3, ey + 0.2, pr, pr, INK);
      E(c, ex + er * 0.3 - pr * 0.4, ey - pr * 0.4, Math.max(0.6, pr * 0.35), Math.max(0.6, pr * 0.35), '#ffffff');
    }
    if (puffed) E(c, R * 0.98, R * 0.18, Math.max(1, R * 0.07), Math.max(1.5, R * 0.11), dead ? '#9ca3ac' : '#ff7b5a');
    else {
      const mr = Math.max(1.6, R * 0.27);
      E(c, R * 0.86, R * 0.28, mr + 1, mr + 1, INK);
      E(c, R * 0.86, R * 0.28, mr, mr, '#7a2830');
    }
  });
  SPR.set(key, sp);
  return sp;
}

function pixSprite(n, fn) {
  const cv = mk(n, n), x2 = cv.getContext('2d'), c0 = (n - 1) / 2;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const col = fn(Math.hypot(x - c0, y - c0), x, y);
    if (col) { x2.fillStyle = col; x2.fillRect(x, y, 1, 1); }
  }
  return { c: cv, ox: c0, oy: c0 };
}

  if (rad > 1) { const x2 = sp.c.getContext('2d'), k = Math.round(sp.ox - rad * 0.45); x2.fillStyle = '#ffffff'; x2.fillRect(k, k, 1, 1); }

// Su: bölge başına renk bantları, geçişlerde düzenli dither.
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function waterImage(z) {
  const a = hexRgb(z.top), b = hexRgb(z.bot), N = 7, cols = [];
  for (let i = 0; i < N; i++) cols.push(a.map((v, j) => Math.round(v + (b[j] - v) * i / (N - 1))));
  const cv = mk(W, H), x2 = cv.getContext('2d'), img = x2.createImageData(W, H), d = img.data;
  for (let y = 0; y < H; y++) {
    const f = Math.min(N - 1, y / SAND_Y * (N - 1)), i = Math.floor(f), fr = (f - i - 0.55) / 0.45;
    for (let x = 0; x < W; x++) {
      const col = cols[Math.min(N - 1, fr > BAYER[(y & 3) * 4 + (x & 3)] / 16 ? i + 1 : i)];
      const o = (y * W + x) * 4;
      d[o] = col[0]; d[o + 1] = col[1]; d[o + 2] = col[2]; d[o + 3] = 255;
    }
  }
  x2.putImageData(img, 0, 0);
  return cv;
}

const TXT = new Map();
function textSprite(str, sc, c1, c2) {
  const key = str + '|' + sc + c1 + (c2 || '');
  let sp = TXT.get(key);
  if (sp) return sp;
  if (TXT.size > 300) TXT.clear();
  const o = sc > 1 ? 2 : 1, pts = [];
  let cx = 0;
  for (const ch of str.toLocaleUpperCase('tr')) {
    const gl = FONT[ch];
    if (!gl) { cx += 4; continue; }
    for (let y = 0; y < 11; y++) for (let x = 0; x < gl[y].length; x++) if (gl[y][x] === '#') pts.push(cx + x, y);
    cx += gl[0].length + 1;
  }
  const cv = mk(Math.max(1, cx - 1) * sc + 2 * o, 11 * sc + 2 * o), x2 = cv.getContext('2d');
  x2.fillStyle = INK;
  for (let i = 0; i < pts.length; i += 2) x2.fillRect(pts[i] * sc, pts[i + 1] * sc, sc + 2 * o, sc + 2 * o);
  for (let i = 0; i < pts.length; i += 2) {
    x2.fillStyle = c2 && pts[i + 1] >= 7 ? c2 : c1;
    x2.fillRect(pts[i] * sc + o, pts[i + 1] * sc + o, sc, sc);
  }
  sp = { c: cv, w: cv.width, top: 3 * sc + o };
  TXT.set(key, sp);
  return sp;
}

let ac = null;
function sfx(f0, f1, dur, type, vol, delay) {
  if (!ac) return;
  const t = ac.currentTime + (delay || 0), o = ac.createOscillator(), gn = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  gn.gain.setValueAtTime(vol, t);
  gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(gn).connect(ac.destination);
  o.start(t); o.stop(t + dur + 0.02);
}

function makeFish(sp, c) {

  fishSprite(sp.id, s, 0); fishSprite(sp.id, s, 1);      // gelmeden önce hazırla
  return { sp, cls: c, s, hl, front: hl * (sp.reach || 1), x: W + hl + s * 1.3 + 8, y: PY, vy: 0,
           flee: false, done: false, eaten: false, ph: rnd(0, 6) };
}
// Sıradaki balığı seç: üst üste en fazla 3 yırtıcı, 2 yem; türler bölgeye göre açılır.
function rollFish() {
  const food = predRow >= 3 || (foodRow < 2 && Math.random() < FOOD_CHANCE);
  if (food) { foodRow++; predRow = 0; } else { predRow++; foodRow = 0; }
  const sp = pick(SPECIES.filter(q => !!q.food === food && q.zone <= zone));
  return makeFish(sp, food ? 0 : pick(sp.cls));
}

function goMenu() {

}
function start() {
  stage = 0; r = R_MIN; deflT = 0; score = 0; count = 0; hunger = 1; zone = 0; prevZone = 0; zoneFade = 1;
  predRow = 0; foodRow = 0; combo = 0; maxCombo = 0; comboPulse = 0; earned = 0;
  pops = []; parts = []; fish = []; banner = null; eaten = false; newBest = false;
  speed = SPEED_START;

const TUT_SPEED = 42;

  { k: 't2', id: 'hamsi', cls: 0, hand: 'wait', need: () => stage === 0, arrow: true, okDur: 3.4 },

];
function startTutorial() {

  state = 'tut'; hunger = 0.45;
  tut = { i: 0, phase: 'intro', t: 0, dur: TUT[0].dur, f: null, ts: 1, lines: L('t0') };

  start();

function spawnTut() {
  const st = TUT[tut.i], f = makeFish(SPECIES.find(q => q.id === st.id), st.cls);
  fish.push(f);

}
function tutResult(f, ok, tier) {
  if (f !== tut.f) return;
  const st = TUT[tut.i];
  if (ok) {
    const k = st.k === 't3' ? (tier && tier.pts === 5 ? 't3okA' : 't3okB') : st.k + 'ok';
    Object.assign(tut, { phase: 'ok', t: 0, dur: st.okDur || 2.4, lines: L(k) });

}
function tutUpdate(dt) {
  const st = TUT[tut.i];
  tut.t += dt;
  let target = 1;
  if (tut.phase === 'go') {
    if (!tut.f.done && tut.f.x - tut.f.front <= PX + r + 40 && !st.need()) target = 0;
  } else if (tut.t > tut.dur) {
    if (tut.phase === 'fail') spawnTut();
    else if (++tut.i < TUT.length) spawnTut();
    else return finishTutorial();
  }
  tut.ts += (target - tut.ts) * Math.min(1, dt * 10);
}

const BTN = {

const inside = (p, b) => p && p.x >= b.x && p.x < b.x + b.w && p.y >= b.y && p.y < b.y + b.h;
function toLow(e) {

}
const click = () => sfx(520, 700, 0.05, 'square', 0.03);

// p: dokunulan nokta (oyun pikseli); klavyeden gelince yok.
function tap(p) {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (ac && ac.state === 'suspended') ac.resume().catch(() => {});   // iOS sesi arka planda kapatır
  if (paused) { paused = false; return; }
  if (state === 'menu') {
    if (inside(p, BTN.lang)) { lang = lang === 'tr' ? 'en' : 'tr'; save('sis_lang', lang); document.title = L('doc'); click(); }
    else if (inside(p, BTN.shop)) { state = 'shop'; shopMsg = null; click(); }
    else if (inside(p, BTN.howto)) { click(); startTutorial(); }
    else if (inside(p, BTN.play) || !p) { click(); if (tutSeen) start(); else startTutorial(); }
  } else if (state === 'shop') {
    if (inside(p, BTN.back) || !p) { goMenu(); click(); return; }
    SKINS.forEach((sk, i) => { if (inside(p, cardRect(i))) shopPick(i); });
  } else if (state === 'dead') {
    if (performance.now() - deadAt < 600) return;
    if (inside(p, BTN.home)) { goMenu(); click(); } else start();
  } else if (state === 'tut') {
    if (inside(p, BTN.skip)) finishTutorial();
    else if (tut.phase !== 'go') { if (tut.t > 0.4) tut.t = tut.dur; }   // yazıyı dokunarak geç
    else puff();

function shopPick(i) {

  if (coins < sk.price) { shopMsg = { text: L('noCoins'), t: 1.6, good: false }; sfx(200, 120, 0.15, 'triangle', 0.06); return; }
  coins -= sk.price; owned.push(sk.id); skin = i;
  save('sis_coins', coins); save('sis_owned', owned); save('sis_skin', i);
  shopMsg = { text: L('bought'), t: 1.6, good: true };

function pop(text, sc, c1, c2, dy) { pops.push({ text, sc, c1, c2, dy: dy || 0, age: 0 }); }
function burst(x, y, n, color, force) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, v = rnd(0.3, 1) * force;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, age: 0, max: rnd(0.4, 0.8), sz: Math.random() < 0.5 ? 1 : 2, color });
  }
}

function update(dt) {
  // Dokunulmazsa kademe kademe söner.
  deflT += dt;
  if (stage > 0 && deflT >= DEFLATE_SECS) { stage--; deflT = 0; sfx(260 + stage * 40, 160, 0.07, 'triangle', 0.02); }
  r += (STAGE_R[stage] - r) * Math.min(1, dt * 16);

  const tutorial = state === 'tut';
  let mdt = dt;                    // balıkların zamanı (eğitimde durabilir)
  if (tutorial) {
    tutUpdate(dt);
    if (state !== 'tut') return;
    speed = TUT_SPEED; mdt = dt * tut.ts;
  } else {
    hunger -= dt / HUNGER_SECS;
    if (hunger <= 0) { hunger = 0; return die(L('starved')); }
    speed = Math.min(SPEED_MAX, SPEED_START + count * SPEED_STEP);
    dist -= speed * dt;
    if (dist <= 0) {
      const f = pending;
      fish.push(f);
      pending = rollFish();
      // Aralık: iki balığın boyu + tepki süresi
      dist = 2 * f.hl + f.s + pending.s + speed * rnd(0.8, 1.3);
    }
  }
  scroll += speed * mdt;

  for (const f of fish) {
    f.x += (f.flee ? speed * 0.9 : -speed) * mdt;
    f.y += f.vy * mdt;
    if (f.done || f.x - f.front > PX + r) continue;

    // Balık bize değdi
    f.done = true;
    if (!tutorial) count++;
    const cx = PX + r, side = Math.random() < 0.5 ? -1 : 1;
    if (f.sp.food) {
      if (stage === 0) {
        f.eaten = true; score += 1;
        hunger = Math.min(1, hunger + FOOD);
        pop(L('yum') + ' +1', 1, '#a6f5b5', '#5fd87a');
        burst(cx, PY, 8, '#e8f8ff', 50);
        sfx(600, 1000, 0.08, 'square', 0.05);
        if (tutorial) tutResult(f, true);
      } else {
        f.flee = true; f.vy = side * 40;
        pop(L('away'), 1, '#d6ecff');
        sfx(300, 200, 0.1, 'triangle', 0.08);
        if (tutorial) tutResult(f, false);
      }
    } else if (stage >= f.cls) {
      f.flee = true; f.vy = side * 40;
      const t = TIERS.find(t => stage - f.cls <= t.diff);
      if (t.pts === 5) {
        combo++; maxCombo = Math.max(maxCombo, combo); comboPulse = 0.35;
        const mult = Math.min(combo, COMBO_MAX), pts = t.pts * mult, k = 1 + 0.12 * (mult - 1);
        score += pts;
        pop(L('close') + (mult > 1 ? ' X' + mult : '') + ' +' + pts, 2, t.c1, t.c2);
        burst(cx, PY, 10 + mult * 4, '#ffe066', 80 + mult * 15);
        sfx(660 * k, 660 * k, 0.07, 'square', 0.05);
        sfx(990 * k, 990 * k, 0.12, 'square', 0.05, 0.07);
        vibrate(25);
      } else {
        if (combo >= 2) { pop(L('comboLost'), 1, '#9aa6b2', null, -14); sfx(400, 200, 0.2, 'triangle', 0.06); }
        combo = 0;
        score += t.pts;
        pop((t.key ? L(t.key) + ' ' : '') + '+' + t.pts, 1, t.c1, t.c2);
        sfx(440, 560, 0.06, 'square', 0.035);
      }
      if (tutorial) tutResult(f, true, t);
    } else if (tutorial) {
      burst(PX, PY, 10, '#f9cf48', 60);
      pop(L('ouch'), 2, '#ff8a6e', '#e5533c');
      sfx(300, 120, 0.2, 'sawtooth', 0.08);
      tutResult(f, false);
    } else {
      eaten = true;
      burst(PX, PY, 22, SKINS[skin].p.body, 110);
      return die(L('eaten'));
    }
  }
  fish = fish.filter(f => !f.eaten && f.x > -f.hl * 1.6 - 60 && f.x < W + 300);
  if (tutorial) return;

  let z = 0;
  ZONES.forEach((zn, i) => { if (count >= zn.at) z = i; });
  if (z !== zone) {
    prevZone = zone; zone = z; zoneFade = 0;
    banner = { text: L('z' + z), age: 0 };
    sfx(523, 523, 0.1, 'square', 0.04); sfx(659, 659, 0.1, 'square', 0.04, 0.1); sfx(784, 784, 0.18, 'square', 0.04, 0.2);
  }
}

// Efektler oyun dursa da akmaya devam eder.
function updateFx(dt) {
  const inGame = state === 'play' || state === 'tut';
  if (!inGame && state !== 'dead') scroll += 20 * dt;
  const zn = ZONES[zone];
  depth += (zn.depth - depth) * Math.min(1, dt * 1.5);
  rays += (zn.rays - rays) * Math.min(1, dt * 1.5);
  zoneFade = Math.min(1, zoneFade + dt / 1.5);
  const drift = inGame ? speed * 0.25 : 8;
  for (const b of bubbles) {
    b.y -= (10 + b.size * 6) * dt; b.x -= drift * dt;
    if (b.y < -6 || b.x < -6) { b.y = SAND_Y + rnd(0, 10); b.x = rnd(0, W + 80); }
  }
  for (const p of plankton) {
    p.x -= drift * 0.6 * dt; p.y += Math.sin(time + p.ph) * 3 * dt;
    if (p.x < -2) { p.x = W + 2; p.y = rnd(10, SAND_Y - 10); }
  }
  for (const p of parts) { p.age += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy -= 25 * dt; }
  parts = parts.filter(p => p.age < p.max);
  for (const p of pops) p.age += dt;
  pops = pops.filter(p => p.age < 0.9);
  if (banner && (banner.age += dt) > 2.2) banner = null;
  if (shopMsg && (shopMsg.t -= dt) <= 0) shopMsg = null;
  comboPulse -= dt;
}

// ---------- Çizim ----------
function txt(str, x, y, sc, c1, c2, align) {
  const sp = textSprite(str, sc || 1, c1 || '#ffffff', c2);
  const dx = align === 'left' ? 0 : align === 'right' ? sp.w : sp.w / 2;
  if (!align) x = Math.max(sp.w / 2, Math.min(W - sp.w / 2, x));   // ortalı yazı ekrandan taşmasın
  g.drawImage(sp.c, Math.round(x - dx), Math.round(y - sp.top));
}
function rrect(x, y, w, h, col) { g.fillStyle = col; g.fillRect(x + 1, y, w - 2, h); g.fillRect(x, y + 1, w, h - 2); }
function panel(x, y, w, h) {
  rrect(x - 1, y - 1, w + 2, h + 2, INK);
  rrect(x, y, w, h, '#d08a3e');
  g.fillStyle = '#e9a85e'; g.fillRect(x + 1, y, w - 2, 1);
  rrect(x + 2, y + 2, w - 4, h - 4, '#f6e7bf');
  g.fillStyle = '#e8d29b'; g.fillRect(x + 3, y + h - 4, w - 6, 1);
}
function button(b, label, sc) {
  sc = sc || 1;
  panel(b.x, b.y, b.w, b.h);
  txt(label, b.x + b.w / 2, b.y + Math.round((b.h - 7 * sc) / 2), sc, sc > 1 ? '#ff9a3c' : '#e07b39', sc > 1 ? '#e0602a' : null);
}
function drawCoins(xr, y, n) {
  const s = String(n), sp = textSprite(s, 1, '#ffe066');
  txt(s, xr, y, 1, '#ffe066', null, 'right');
  g.drawImage(COIN.c, Math.round(xr - sp.w - 10), y - 1);
}
function drawArrow(x, y, up) {
  g.save(); g.translate(Math.round(x), Math.round(y));
  if (up) g.scale(1, -1);
  g.drawImage(ARROW.c, -ARROW.ox, -ARROW.oy);
  g.restore();
}
// tap: parmak tekrar tekrar dokunuyor; wait: el kalkık bekliyor.
function drawHand(x, y, mode) {
  if (mode === 'tap') {
    const k = (time * 2.5) % 1, down = k < 0.5;
    if (down) {
      const sp = ringSprite(Math.round(3 + k * 14), 'rgba(255,255,255,0.85)');
      g.globalAlpha = 1 - k * 2; g.drawImage(sp.c, x - sp.ox, y - sp.oy); g.globalAlpha = 1;
    }
    g.drawImage(HAND.c, x - HAND.ox, y - (down ? 0 : 5) - HAND.oy);
  } else g.drawImage(HAND.c, x - HAND.ox, y - 9 - Math.round(Math.sin(time * 3) * 2) - HAND.oy);
}

function drawFishAt(id, s, x, y, flee, ph) {
  const sp = fishSprite(id, s, Math.floor(time * 6 + (ph || 0)) & 1);
  x = Math.round(x); y = Math.round(y);
  if (flee) { g.save(); g.translate(x, y); g.scale(-1, 1); g.drawImage(sp.c, -sp.ox, -sp.oy); g.restore(); }
  else g.drawImage(sp.c, x - sp.ox, y - sp.oy);
}
function drawFish(f) {
  const y = f.y + Math.sin(time * 2 + f.ph) * 1.5;
  drawFishAt(f.sp.id, f.s, f.x, y, f.flee, f.ph);
  if (f.sp.id === 'fener') {
    const gx = f.x + (f.flee ? 1 : -1) * f.hl * 1.25, gy = y - f.s * 1.05;
    g.globalAlpha = 0.55 + 0.35 * Math.sin(time * 5 + f.ph);
    g.drawImage(GLOW.c, Math.round(gx) - GLOW.ox, Math.round(gy) - GLOW.oy);
    g.globalAlpha = 1;
  }
}
// Yaklaşan her balığın başının üstünde, şu anki kademene göre anında değişen rozet.
function drawBadges() {
  for (const f of fish) {
    if (f.done || f.flee || f.x - f.front > W - 4) continue;
    let sp, danger = false;
    if (f.sp.food) sp = stage === 0 ? BADGE.eat : BADGE.no;
    else {
      danger = stage < f.cls;
      sp = BADGE[danger ? 'bad' : stage === f.cls ? 'gold' : 'ok'][f.cls];
    }
    const close = f.x - f.front - (PX + r) < 90;
    const bounce = danger && close ? -Math.round(Math.abs(Math.sin(time * 10)) * 2) : 0;
    const y = Math.max(64, Math.round(f.y + Math.sin(time * 2 + f.ph) * 1.5 - f.s * 1.25 - 10)) + bounce;
    g.drawImage(sp.c, Math.round(f.x - f.hl * 0.55) - 6, y - 6);
  }
  if (!eaten) {
    const by = Math.max(64, Math.round(PY - r * 0.8 - 6));
    g.drawImage(BADGE.me[stage].c, Math.round(PX + r * 0.8) - 2, by - 6);
  }
}
function drawPuffer(x, y, rad, dead) {
  const sp = pufferSprite(Math.round(rad), Math.floor(time * 5) & 1, skin, dead);
  g.drawImage(sp.c, Math.round(x) - sp.ox, Math.round(y + Math.sin(time * 2.5) * 1.5) - sp.oy);
}

function groundTop(wx) { return SAND_Y + Math.round(Math.sin(wx * 0.05) * 1.5 + Math.sin(wx * 0.13) * 0.8); }
function hills(f, col, fn) {
  g.fillStyle = col;
  const off = scroll * f;
  for (let x = 0; x < W; x++) { const h = Math.round(fn(Math.floor(x + off))); g.fillRect(x, SAND_Y - h, 1, h + 2); }
}
function weed(x, gy, h, ph) {
  for (const [dx, k] of [[0, 1], [3, 0.7], [-3, 0.5]]) {
    const hh = Math.round(h * k), xs = [];
    for (let y = 0; y < hh; y++) xs.push(x + dx + Math.round(Math.sin(time * 1.8 + ph + dx + y * 0.12) * 3 * y / hh));
    g.fillStyle = INK;
    for (let y = 0; y < hh; y++) g.fillRect(xs[y] - 1, gy - y, (y > hh - 3 ? 1 : 2) + 2, 1);
    g.fillRect(xs[hh - 1], gy - hh, 1, 1);
    g.fillStyle = '#2f9c58';
    for (let y = 0; y < hh; y++) g.fillRect(xs[y], gy - y, y > hh - 3 ? 1 : 2, 1);
    g.fillStyle = '#5cc47f';
    for (let y = 2; y < hh - 2; y += 4) g.fillRect(xs[y], gy - y, 1, 2);
  }
}

const tops = new Int16Array(W);
function drawWorld() {
  if (zoneFade < 1 && prevZone !== zone) { g.drawImage(WATER[prevZone], 0, 0); g.globalAlpha = zoneFade; }
  g.drawImage(WATER[zone], 0, 0);
  g.globalAlpha = 1;

  if (rays > 0.02) for (let i = 0; i < 3; i++) {
    const x0 = W * (0.25 + i * 0.35) + 40 + Math.sin(time * 0.25 + i * 2) * 10;
    for (let s = 0; s < 6; s++) {
      g.fillStyle = 'rgba(255,255,255,' + (0.075 * rays * (1 - s / 6)).toFixed(3) + ')';
      for (let y = s * 28; y < (s + 1) * 28 && y < SAND_Y; y++) g.fillRect(Math.round(x0 - y * 0.45), y, Math.round(10 + y * 0.12), 1);
    }
  }

  hills(0.15, 'rgba(3,26,48,0.22)', k => 34 + 12 * Math.sin(k * 0.017) + 6 * Math.sin(k * 0.051));
  hills(0.4, 'rgba(3,26,48,0.3)', k => 16 + 9 * Math.sin(k * 0.031 + 1) + 5 * Math.sin(k * 0.097));

  for (let x = 0; x < W; x++) tops[x] = groundTop(Math.floor(x + scroll));
  g.fillStyle = INK;       for (let x = 0; x < W; x++) g.fillRect(x, tops[x] - 1, 1, 1);
  g.fillStyle = '#e3c486'; for (let x = 0; x < W; x++) g.fillRect(x, tops[x], 1, H - tops[x]);
  g.fillStyle = '#f5e0a8'; for (let x = 0; x < W; x++) g.fillRect(x, tops[x], 1, 1);
  g.fillStyle = '#cfae70'; g.fillRect(0, H - 4, W, 4);
  g.fillStyle = '#b8925a';
  for (let x = 0; x < W; x++) {
    const h = hash(Math.floor(x + scroll));
    if (h < 0.22) g.fillRect(x, tops[x] + 2 + Math.floor(h * 60) % 8, 1, 1);
  }

  for (const d of DECO) {
    const sx = Math.round(((d.x - scroll) % SW + SW) % SW - 30);
    if (sx > W + 30) continue;
    const gy = groundTop(Math.floor(sx + scroll)) + 1;
    if (d.type === 'weed') weed(sx, gy, d.h, d.ph);
    else { const sp = DECO_ART[d.type]; g.drawImage(sp.c, sx - sp.ox, gy - sp.oy); }
  }

  if (depth > 0.01) { g.fillStyle = 'rgba(4,16,34,' + depth.toFixed(3) + ')'; g.fillRect(0, 0, W, H); }

  for (const b of bubbles) { const sp = BUB[b.size - 1]; g.drawImage(sp.c, Math.round(b.x) - sp.ox, Math.round(b.y) - sp.oy); }
  g.fillStyle = 'rgba(255,255,255,0.35)';
  for (const p of plankton) g.fillRect(Math.round(p.x), Math.round(p.y), 1, 1);
}

function drawHud() {
  const tutorial = state === 'tut';
  if (state !== 'dead' && !tutorial) {
    txt(String(score), W / 2, 26, 3, '#ffffff', '#dcecff');
    if (combo >= 2) txt(L('combo') + ' X' + Math.min(combo, COMBO_MAX), W / 2, 54, comboPulse > 0 ? 2 : 1, '#ffe066', '#f5a623');
  }

  const ic = fishSprite('hamsi', 3, 0);
  g.drawImage(ic.c, 12 - ic.ox, 11 - ic.oy);
  const bx = 24, by = 8, bw = 54, lowH = hunger < 0.3;
  rrect(bx - 1, by - 1, bw + 2, 8, INK);
  g.fillStyle = '#1b3850'; g.fillRect(bx, by, bw, 6);
  const fw = Math.round(bw * hunger);
  if (fw > 0 && !(lowH && Math.floor(time * 6) % 2)) {
    g.fillStyle = lowH ? '#ff5d4a' : '#5fd87a'; g.fillRect(bx, by, fw, 6);
    g.fillStyle = lowH ? '#ff9d8a' : '#a6f5b5'; g.fillRect(bx, by, fw, 2);
  }

  if (!tutorial && best) txt(L('best') + ' ' + best, W - 6, 8, 1, '#bfe0ff', null, 'right');
  if (banner) {
    g.globalAlpha = Math.max(0, Math.min(1, banner.age * 3, (2.2 - banner.age) * 2));
    txt(banner.text, W / 2, 84, 2, '#ffffff', '#bfe0ff');
    g.globalAlpha = 1;
  }
}

function drawMenu() {
  button(BTN.lang, L('lang'));
  drawCoins(W - 6, 8, coins);
  if (best) txt(L('best') + ' ' + best, W - 6, 20, 1, '#ffffff', null, 'right');
  const [t1, t2] = L('title').split(' ');
  txt(t1, W / 2, 40, 5, '#ffe066', '#f5a623');
  txt(t2, W / 2, 84, 5, '#ffe066', '#f5a623');
  wrap([L('tagline')], W - 16).forEach((l, i) => txt(l.s, W / 2, 132 + i * 11, 1, '#ffffff'));
  menuR += (STAGE_R[Math.floor(time * 1.2) % 4] - menuR) * 0.2;
  drawPuffer(50, 180, menuR, false);
  drawFishAt('kopekbaligi', STAGE_R[1] - 2, 138, 180, false, 0);
  button(BTN.play, L('play'), 2);
  button(BTN.shop, L('shop'));
  button(BTN.howto, L('howto'));
}

// Uzun yazıları dar ekrana sığacak şekilde satırlara böler; k = kaçıncı kaynak satırdan geldiği.
const WRAP = new Map();
function wrap(lines, maxW) {
  const key = lines.join('|') + maxW;
  if (WRAP.has(key)) return WRAP.get(key);
  const out = [];
  lines.forEach((ln, k) => {
    let cur = '';
    for (const w of ln.split(' ')) {
      const t = cur ? cur + ' ' + w : w;
      if (cur && textSprite(t, 1, '#ffffff').w > maxW) { out.push({ s: cur, k }); cur = w; } else cur = t;
    }
    out.push({ s: cur, k });
  });
  WRAP.set(key, out);
  return out;
}

function drawShop() {
  g.fillStyle = 'rgba(4,16,34,0.35)'; g.fillRect(0, 0, W, H);
  txt(L('shop'), W / 2, 26, 2, '#ffe066', '#f5a623');
  button(BTN.back, L('back'));
  drawCoins(W - 6, 9, coins);
  SKINS.forEach((sk, i) => {
    const b = cardRect(i), cx = b.x + b.w / 2, sel = i === skin, have = owned.includes(sk.id);
    if (sel) rrect(b.x - 3, b.y - 3, b.w + 6, b.h + 6, '#ffe066');
    panel(b.x, b.y, b.w, b.h);
    const sp = pufferSprite(STAGE_R[1], Math.floor(time * 5) & 1, i, false);
    g.drawImage(sp.c, Math.round(cx + 4 - sp.ox), b.y + 22 - sp.oy);
    txt(sk[lang], cx, b.y + 42, 1, '#ffffff');
    if (sel) txt(L('selected'), cx, b.y + 53, 1, '#7ee08f');
    else if (have) txt(L('select'), cx, b.y + 53, 1, '#9fd4ff');
    else {
      const s = String(sk.price), w = textSprite(s, 1, '#ffe066').w;
      txt(s, cx + 5, b.y + 53, 1, coins >= sk.price ? '#ffe066' : '#ff8a6e');
      g.drawImage(COIN.c, Math.round(cx + 5 - w / 2 - 11), b.y + 52);
    }
  });
  if (shopMsg) txt(shopMsg.text, W / 2, 280, 1, shopMsg.good ? '#7ee08f' : '#ff8a6e');
}

function drawTut() {
  const st = TUT[tut.i];
  txt(L('howtoTitle'), W / 2, 26, 1, '#ffffff');
  for (let k = 1; k < TUT.length; k++) {
    const x = W / 2 - 14 + (k - 1) * 10;
    rrect(x - 1, 37, 6, 6, INK);
    g.fillStyle = k <= tut.i ? '#ffe066' : '#3b5670'; g.fillRect(x, 38, 4, 4);
  }
  button(BTN.skip, L('skip'));
  const bob = Math.round(Math.sin(time * 6) * 2);
  if (tut.phase === 'intro') drawArrow(PX, PY - r - 8 + bob, false);
  if (tut.phase === 'go' && !st.need()) drawHand(W - 22, 100, st.hand);
  if (tut.phase === 'ok' && st.arrow) drawArrow(51, 17 - bob, true);
  if (tut.lines) {
    const fail = tut.phase === 'fail', rows = wrap(tut.lines, W - 20), h = 10 + rows.length * 11, py = 234;
    panel(6, py, W - 12, h);
    rows.forEach((l, i) => txt(l.s, W / 2, py + 6 + i * 11, 1,
      l.k === 0 ? (fail ? '#ff8a6e' : '#ffe066') : '#ffffff', l.k === 0 ? (fail ? '#e5533c' : '#f5a623') : null));
    if (tut.phase !== 'go' && tut.t > 0.4 && time % 0.8 < 0.5) {      // "dokun, devam" işareti
      const ix = W - 20, iy = py + h - 7;
      g.fillStyle = '#e07b39'; g.fillRect(ix, iy, 5, 1); g.fillRect(ix + 1, iy + 1, 3, 1); g.fillRect(ix + 2, iy + 2, 1, 1);
    }
  }
}

function drawDead() {
  const e = performance.now() - deadAt;
  g.fillStyle = 'rgba(4,14,28,' + (0.55 * Math.min(1, e / 400)).toFixed(3) + ')';
  g.fillRect(0, 0, W, H);
  if (e < 300) return;
  txt(deadMsg, W / 2, 62, 3, '#ff8a6e', '#e5533c');
  const px = 10, pr = W - 22;
  panel(px, 98, W - 20, 104);
  txt(L('score'), px + 12, 110, 1, '#e07b39', null, 'left');
  txt(String(score), pr, 108, 2, '#ffffff', '#dcecff', 'right');
  txt(L('best'), px + 12, 134, 1, '#e07b39', null, 'left');
  if (newBest) txt(L('new'), px + 12, 146, 1, '#ff5d4a', null, 'left');
  txt(String(best), pr, 132, 2, '#ffffff', '#dcecff', 'right');
  wrap([L('z' + zone) + (maxCombo >= 2 ? '  ·  ' + L('combo') + ' X' + maxCombo : '')], W - 36)
    .forEach((l, i) => txt(l.s, W / 2, 162 + i * 10, 1, '#5aa0cf'));
  const s = '+' + earned, w = textSprite(s, 1, '#ffe066').w;
  txt(s, W / 2 + 6, 186, 1, '#ffe066');
  g.drawImage(COIN.c, Math.round(W / 2 + 6 - w / 2 - 11), 185);
  if (e > 600) { button(BTN.retry, L('retry')); button(BTN.home, L('home')); }
}

function render() {
  g.save();
  if (state === 'dead') {
    const k = 1 - (performance.now() - deadAt) / 350;
    if (k > 0) g.translate(Math.round(rnd(-3, 3) * k), Math.round(rnd(-3, 3) * k));
  }
  drawWorld();
  if (state === 'menu') { g.restore(); drawMenu(); return; }
  if (state === 'shop') { g.restore(); drawShop(); return; }

  for (const f of fish) drawFish(f);
  if (!eaten) drawPuffer(PX, PY, r, state === 'dead');
  for (const p of parts) {
    g.globalAlpha = 1 - p.age / p.max; g.fillStyle = p.color;
    g.fillRect(Math.round(p.x), Math.round(p.y), p.sz, p.sz);
  }
  g.globalAlpha = 1;
  if (state !== 'dead') drawBadges();
  for (const p of pops) {
    g.globalAlpha = Math.max(0, Math.min(1, (0.9 - p.age) * 4));
    const sc = p.sc > 1 && textSprite(p.text, 2, p.c1, p.c2).w > W - 4 ? 1 : p.sc;
    txt(p.text, PX, Math.max(70, PY - r - 16) - p.age * 22 + p.dy, sc, p.c1, p.c2);
  }
  g.globalAlpha = 1;
  g.restore();

  drawHud();
  if (state === 'tut') drawTut();
  if (state === 'dead') drawDead();
}

// Sprite'lar: seçili görünüm ve ilk bölge hemen, gerisi her karede birkaç tane.
const bakeQueue = [];
function queuePuffer(si) {
  for (let R = R_MIN; R <= R_MAX; R++) for (const f of [0, 1]) bakeQueue.unshift(() => pufferSprite(R, f, si, false));
}
for (let R = R_MIN; R <= R_MAX; R++) for (const f of [0, 1]) pufferSprite(R, f, skin, false);
for (const sp of SPECIES) for (const c of sp.food ? [0] : sp.cls) for (const f of [0, 1]) {
  if (sp.zone === 0) fishSprite(sp.id, sizeOf(sp, c), f);
  else bakeQueue.push(() => fishSprite(sp.id, sizeOf(sp, c), f));
}

let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - lastT) / 1000);
  lastT = now; time = now / 1000;
  for (let n = state === 'play' ? 1 : 3; n > 0 && bakeQueue.length; n--) bakeQueue.shift()();
  if (!paused && (state === 'play' || state === 'tut')) update(dt);
  if (!paused) updateFx(dt);
  render();
  if (paused) {
    g.fillStyle = 'rgba(4,14,28,0.6)'; g.fillRect(0, 0, W, H);
    txt(L('paused'), W / 2, H / 2 - 20, 2, '#ffffff', '#bfe0ff');
    if (time % 1 < 0.7) txt(L('resume'), W / 2, H / 2 + 10, 1, '#ffe066', '#f5a623');
  }
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(low, 0, 0, canvas.width, canvas.height);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
